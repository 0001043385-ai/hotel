<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Hotel</title>

    <!--CSS Externo-->
    <link rel="stylesheet" href="css/estilo.css">

    <!--CSS Interno-->
    <style>
        input{
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
        }

        form{
            text-align: center;
        }

        button{
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!--CSS Inline-->
    <h1 style="text-align: center; color: #6f42c1;">Imperial Palace</h1>
    
    <h2 style="text-align: center;">Cadastro de Hotel</h2>

    <form action="salvar_hotel.php" method="post">

        <label for="nome">Nome do hotel:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome do hotel" required>

        <br><br>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" placeholder="Digite o nome da cidade onde
        o hotel está situado" required>

        <br><br>

        <label for="estrelas">Classificação em estrelas:</label>
        <input type="number" id="estrelas" name="estrelas" min="1" max="5" required>

        <br><br>

        <label for="email">email</label>
        <input type="text" id="email" name="email" placeholder="Digite seu email" required>

        <br><br>

        <label for="senha">senha</label>
        <input type="text" id="senha" name="senha" placeholder="Digite sua senha" required>

        <br><br>
        
        <button type="submit">Cadastrar Hotel</button>

    </form>

    <br>
    <div style="text-align: center;">
        <a href="index.html">Clique aqui para retornar</a>
    </div>
    
</body>
</html>
