<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Quarto</title>
</head>
<body>
    
    <h1>Cadastrar Quarto</h1>

    <form action="salvar_quarto.php" method="post">

        <label for="id_hotel">ID do Hotel:</label>
        <input type="number" id="id_hotel" name="id_hotel" required>

        <br><br>

        <label for="numero_quarto">Número do Quarto:</label>
        <input type="text" id="numero_quarto" name="numero_quarto"
        placeholder="Ex: 101, 202-A" required>

        <br><br>

        <label for="tipo_quarto">Tipo de Quarto:</label>
        <input type="text" id="tipo_quarto" name="tipo"
        placeholder="Ex: Solteiro, Casal, Suíte Luxo" required>

        <br><br>

        <label for="preco_diaria">Preço da Diária (R$):</label>
        <input type="number" id="preco_diaria" name="preco"
        step="0.01" required>

        <br><br>

        <button type="submit">Salvar Quarto</button>

    </form>

    <br>

    <a href="logout_hotel.php">Sair/Deslogar</a>
    
</body>
</html>
